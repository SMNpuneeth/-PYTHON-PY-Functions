<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>**PYTHON PY**</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #000000;
            --neon-orange: #FF5F1F;
            --neon-orange-dim: rgba(255, 95, 31, 0.3);
            --neon-orange-glow: 0 0 10px #FF5F1F, 0 0 20px rgba(255, 95, 31, 0.5);
            --font-retro: 'Press Start 2P', cursive;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; cursor: crosshair; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-black);
            color: var(--neon-orange);
            font-family: var(--font-mono);
            overflow: hidden;
            text-transform: uppercase;
        }

        .crt-bg {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .scanline {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 95, 31, 0.03) 50%, transparent 100%);
            background-size: 100% 100px;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        .retro-border {
            border: 4px solid var(--neon-orange);
            box-shadow: var(--neon-orange-glow), inset 0 0 10px var(--neon-orange-dim);
        }
        .retro-text { font-family: var(--font-retro); text-shadow: var(--neon-orange-glow); }
        .btn-retro {
            background: transparent; border: 2px solid var(--neon-orange);
            color: var(--neon-orange); font-family: var(--font-retro);
            font-size: 0.6rem; padding: 10px 20px; transition: all 0.2s;
        }
        .btn-retro:hover { background: var(--neon-orange); color: var(--bg-black); box-shadow: var(--neon-orange-glow); }

        .app-icon-container {
            position: relative; width: 80px; height: 80px;
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
        }
        .icon-outline {
            position: absolute; inset: 0; border: 3px solid var(--neon-orange);
            border-radius: 10px; animation: iconPulse 2s infinite ease-in-out;
            box-shadow: var(--neon-orange-glow);
        }
        .icon-symbol { font-size: 2.5rem; z-index: 1; }
        @keyframes iconPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }

        .os-container { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 20px; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 4px double var(--neon-orange); }
        .main-hub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; align-items: center; justify-items: center; }
        .app-module {
            width: 300px; height: 300px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 20px; transition: all 0.3s;
        }
        .app-module:hover { background: var(--neon-orange-dim); transform: scale(1.05); }

        .window {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .window.active { opacity: 1; pointer-events: auto; }
        .window-content { background: var(--bg-black); width: 90%; max-width: 500px; padding: 30px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 10px; font-family: var(--font-retro); cursor: pointer; color: var(--neon-orange); }
        .input-retro {
            background: transparent; border: 2px solid var(--neon-orange);
            color: var(--neon-orange); font-family: var(--font-mono);
            padding: 10px; width: 100%; margin-bottom: 15px; outline: none;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn {
            border: 2px solid var(--neon-orange); padding: 15px; text-align: center;
            cursor: pointer; font-family: var(--font-retro); font-size: 0.7rem;
        }
        .calc-btn:hover { background: var(--neon-orange); color: var(--bg-black); }
        .footer { text-align: center; font-size: 0.7rem; border-top: 4px double var(--neon-orange); padding-top: 10px; }
    </style>
</head>
<body>
    <div class="crt-bg"></div>
    <div class="scanline"></div>

    <div class="os-container">
        <header class="header">
            <div class="retro-text" style="font-size: 1.2rem;">** PYTHON PY **</div>
            <div class="mono" id="clock">00:00:00</div>
        </header>

        <main class="main-hub">
            <div class="app-module retro-border" onclick="openApp('atm')">
                <div class="app-icon-container">
                    <div class="icon-outline"></div>
                    <div class="icon-symbol">🏦</div>
                </div>
                <div class="retro-text" style="margin-bottom: 10px;">BANK_CORE</div>
                <div class="mono" style="font-size: 0.7rem;">atmbank.py</div>
            </div>

            <div class="app-module retro-border" onclick="openApp('contacts')">
                <div class="app-icon-container">
                    <div class="icon-outline"></div>
                    <div class="icon-symbol">📖</div>
                </div>
                <div class="retro-text" style="margin-bottom: 10px;">DATA_BOOK</div>
                <div class="mono" style="font-size: 0.7rem;">contactbook.py</div>
            </div>

            <div class="app-module retro-border" onclick="openApp('calc')">
                <div class="app-icon-container">
                    <div class="icon-outline"></div>
                    <div class="icon-symbol">⚙️</div>
                </div>
                <div class="retro-text" style="margin-bottom: 10px;">MATH_ENG</div>
                <div class="mono" style="font-size: 0.7rem;">calculator.py</div>
            </div>
        </main>

        <footer class="footer">
            <div class="mono">SYSTEM READY // NO ERRORS DETECTED // PRESS START TO BEGIN</div>
        </footer>
    </div>

    <!-- ATM WINDOW: Mirroring atmbank.py options -->
    <div id="atm" class="window">
        <div class="window-content retro-border">
            <div class="close-btn" onclick="closeApp('atm')">[X]</div>
            <h2 class="retro-text" style="text-align: center; margin-bottom: 20px;">BANK_CORE</h2>
            <div id="atm-menu" class="flex flex-col gap-4">
                <button onclick="atmOption(1)" class="btn-retro">1. CHECK BALANCE</button>
                <button onclick="atmOption(2)" class="btn-retro">2. DEPOSIT</button>
                <button onclick="atmOption(3)" class="btn-retro">3. WITHDRAW</button>
                <button onclick="closeApp('atm')" class="btn-retro">4. EXIT</button>
            </div>
            <div id="atm-action" class="hidden flex flex-col gap-4">
                <div id="atm-display" class="mono text-center mb-4"></div>
                <input type="number" id="atm-amt" class="input-retro" placeholder="ENTER AMOUNT...">
                <button onclick="atmExecute()" class="btn-retro w-full">EXECUTE_TRANSACTION</button>
                <button onclick="atmReset()" class="btn-retro w-full mt-2" style="border-color: gray; color: gray;">BACK_TO_MENU</button>
            </div>
            <div id="atm-msg" class="mono text-center mt-4 text-xs"></div>
        </div>
    </div>

    <!-- CONTACTS WINDOW: Mirroring contactbook.py options -->
    <div id="contacts" class="window">
        <div class="window-content retro-border">
            <div class="close-btn" onclick="closeApp('contacts')">[X]</div>
            <h2 class="retro-text" style="text-align: center; margin-bottom: 20px;">DATA_BOOK</h2>
            <div id="con-menu" class="flex flex-col gap-4">
                <button onclick="conOption(1)" class="btn-retro">1. ADD CONTACT</button>
                <button onclick="conOption(2)" class="btn-retro">2. SEARCH CONTACT</button>
                <button onclick="conOption(3)" class="btn-retro">3. UPDATE CONTACT</button>
                <button onclick="conOption(4)" class="btn-retro">4. DELETE CONTACT</button>
                <button onclick="conOption(5)" class="btn-retro">5. VIEW ALL</button>
                <button onclick="closeApp('contacts')" class="btn-retro">6. EXIT</button>
            </div>
            <div id="con-action" class="hidden flex flex-col gap-4">
                <input type="text" id="con-name" class="input-retro" placeholder="ENTER NAME...">
                <input type="text" id="con-phone" class="input-retro" placeholder="ENTER PHONE (10 DIGITS)...">
                <button onclick="conExecute()" class="btn-retro w-full">CONFIRM_ACTION</button>
                <button onclick="conReset()" class="btn-retro w-full mt-2" style="border-color: gray; color: gray;">BACK_TO_MENU</button>
            </div>
            <div id="con-display" class="mono text-sm mt-4 max-h-40 overflow-y-auto p-2 border-t-2 border-orange-600"></div>
        </div>
    </div>

    <!-- CALC WINDOW -->
    <div id="calc" class="window">
        <div class="window-content retro-border">
            <div class="close-btn" onclick="closeApp('calc')">[X]</div>
            <h2 class="retro-text" style="text-align: center; margin-bottom: 20px;">MATH_ENG</h2>
            <div class="retro-border p-4 text-right mb-4 bg-black">
                <div id="calc-hist" class="text-xs opacity-50 mb-1"></div>
                <div id="calc-disp" class="text-2xl font-bold">0</div>
            </div>
            <div class="calc-grid">
                <div class="calc-btn" onclick="calcOp('C')">C</div>
                <div class="calc-btn" onclick="calcOp('/')">/</div>
                <div class="calc-btn" onclick="calcOp('*')">*</div>
                <div class="calc-btn" onclick="calcOp('-')">-</div>
                <div class="calc-btn" onclick="calcNum('7')">7</div>
                <div class="calc-btn" onclick="calcNum('8')">8</div>
                <div class="calc-btn" onclick="calcNum('9')">9</div>
                <div class="calc-btn" onclick="calcOp('+')">+</div>
                <div class="calc-btn" onclick="calcNum('4')">4</div>
                <div class="calc-btn" onclick="calcNum('5')">5</div>
                <div class="calc-btn" onclick="calcNum('6')">6</div>
                <div class="calc-btn" onclick="calcRes()" style="grid-row: span 2; background: var(--neon-orange); color: black;">=</div>
                <div class="calc-btn" onclick="calcNum('1')">1</div>
                <div class="calc-btn" onclick="calcNum('2')">2</div>
                <div class="calc-btn" onclick="calcNum('3')">3</div>
                <div class="calc-btn" onclick="calcNum('0')" style="grid-column: span 2;">0</div>
                <div class="calc-btn" onclick="calcNum('.')">.</div>
            </div>
        </div>
    </div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        function openApp(id) { document.getElementById(id).classList.add('active'); }
        function closeApp(id) { document.getElementById(id).classList.remove('active'); }

        // ATM LOGIC - mirroring atmbank.py
        let balance = 10000;
        let atmCurrentOption = null;
        function atmOption(opt) {
            atmCurrentOption = opt;
            document.getElementById('atm-menu').classList.add('hidden');
            document.getElementById('atm-action').classList.remove('hidden');
            const disp = document.getElementById('atm-display');
            if(opt === 1) {
                disp.innerText = `CURRENT BALANCE: $${balance.toLocaleString()}`;
                document.getElementById('atm-amt').classList.add('hidden');
                document.querySelector('#atm-action button').classList.add('hidden');
            } else if(opt === 2) {
                disp.innerText = "ACTION: DEPOSIT";
                document.getElementById('atm-amt').classList.remove('hidden');
                document.querySelector('#atm-action button').classList.remove('hidden');
            } else if(opt === 3) {
                disp.innerText = "ACTION: WITHDRAW";
                document.getElementById('atm-amt').classList.remove('hidden');
                document.querySelector('#atm-action button').classList.remove('hidden');
            }
        }
        function atmExecute() {
            const amt = parseFloat(document.getElementById('atm-amt').value);
            const msg = document.getElementById('atm-msg');
            if(!amt || amt <= 0) { msg.innerText = "ERROR: INVALID AMOUNT"; return; }

            if(atmCurrentOption === 2) {
                balance += amt;
                msg.innerText = `SUCCESS: DEPOSITED $${amt}`;
            } else if(atmCurrentOption === 3) {
                if(amt > balance) { msg.innerText = "ERROR: INSUFFICIENT FUNDS"; return; }
                balance -= amt;
                msg.innerText = `SUCCESS: WITHDREW $${amt}`;
            }
            document.getElementById('atm-amt').value = '';
            atmReset();
        }
        function atmReset() {
            document.getElementById('atm-menu').classList.remove('hidden');
            document.getElementById('atm-action').classList.add('hidden');
            document.getElementById('atm-msg').innerText = '';
            document.getElementById('atm-amt').classList.remove('hidden');
        }

        // CONTACTS LOGIC - mirroring contactbook.py
        let contacts = {};
        let conCurrentOption = null;
        function conOption(opt) {
            conCurrentOption = opt;
            document.getElementById('con-menu').classList.add('hidden');
            document.getElementById('con-action').classList.remove('hidden');
            document.getElementById('con-display').innerText = '';
            if(opt === 5) {
                conExecute();
                document.getElementById('con-action').classList.add('hidden');
            }
        }
        function conExecute() {
            const name = document.getElementById('con-name').value.trim();
            const phone = document.getElementById('con-phone').value.trim();
            const disp = document.getElementById('con-display');

            if(conCurrentOption === 1) { // Add
                if(!name || phone.length !== 10) { disp.innerText = "ERROR: INVALID INPUT"; return; }
                if(name in contacts) { disp.innerText = "ERROR: CONTACT EXISTS"; return; }
                contacts[name] = phone;
                disp.innerText = "SUCCESS: CONTACT ADDED";
            } else if(conCurrentOption === 2) { // Search
                if(!name) { disp.innerText = "ERROR: ENTER NAME"; return; }
                disp.innerText = contacts[name] ? `FOUND: ${name} - ${contacts[name]}` : "ERROR: NOT FOUND";
            } else if(conCurrentOption === 3) { // Update
                if(!name || !contacts[name]) { disp.innerText = "ERROR: NOT FOUND"; return; }
                if(phone.length !== 10) { disp.innerText = "ERROR: INVALID PHONE"; return; }
                contacts[name] = phone;
                disp.innerText = "SUCCESS: CONTACT UPDATED";
            } else if(conCurrentOption === 4) { // Delete
                if(!name || !contacts[name]) { disp.innerText = "ERROR: NOT FOUND"; return; }
                delete contacts[name];
                disp.innerText = "SUCCESS: CONTACT DELETED";
            } else if(conCurrentOption === 5) { // View
                let list = "ALL CONTACTS:\n";
                for(let n in contacts) list += `${n}: ${contacts[n]}\n`;
                disp.innerText = Object.keys(contacts).length ? list : "NO CONTACTS FOUND";
            }
            document.getElementById('con-name').value = '';
            document.getElementById('con-phone').value = '';
        }
        function conReset() {
            document.getElementById('con-menu').classList.remove('hidden');
            document.getElementById('con-action').classList.add('hidden');
            document.getElementById('con-display').innerText = '';
        }

        // CALC Logic
        let cState = { curr: '0', prev: null, op: null };
        function updateC() {
            document.getElementById('calc-disp').innerText = cState.curr;
            document.getElementById('calc-hist').innerText = cState.prev ? `${cState.prev} ${cState.op || ''}` : '';
        }
        function calcNum(n) {
            if(cState.curr === '0' && n !== '.') cState.curr = n;
            else if(n === '.' && cState.curr.includes('.')) return;
            else cState.curr += n;
            updateC();
        }
        function calcOp(o) {
            if(o === 'C') { cState = {curr:'0', prev:null, op:null}; updateC(); return; }
            cState.prev = cState.curr;
            cState.op = o;
            cState.curr = '0';
            updateC();
        }
        function calcRes() {
            const a = parseFloat(cState.prev);
            const b = parseFloat(cState.curr);
            if(isNaN(a) || isNaN(b)) return;
            let r = 0;
            if(cState.op === '+') r = a + b;
            else if(cState.op === '-') r = a - b;
            else if(cState.op === '*') r = a * b;
            else if(cState.op === '/') r = b !== 0 ? a / b : 'ERR';
            cState.curr = r.toString();
            cState.prev = null;
            cState.op = null;
            updateC();
        }
    </script>
</body>
</html>
